name: Convert Kelong Images to JPG

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert WebP images to JPG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          img_dir = Path("public/images")
          for name in ["kelong-aladdin-1", "kelong-aladdin-2"]:
              src = img_dir / f"{name}.webp"
              dst = img_dir / f"{name}.jpg"
              if src.exists():
                  with Image.open(src) as im:
                      if im.mode not in ("RGB", "L"):
                          bg = Image.new("RGB", im.size, "white")
                          if "A" in im.mode:
                              bg.paste(im, mask=im.getchannel("A"))
                              im = bg
                          else:
                              im = im.convert("RGB")
                      elif im.mode != "RGB":
                          im = im.convert("RGB")
                      im.save(dst, "JPEG", quality=94, optimize=True)
                  src.unlink()

          for file in [Path("public/index.html"), Path("public/styles.css")]:
              if file.exists():
                  text = file.read_text(encoding="utf-8")
                  text = text.replace("/images/kelong-aladdin-1.webp", "/images/kelong-aladdin-1.jpg")
                  text = text.replace("/images/kelong-aladdin-2.webp", "/images/kelong-aladdin-2.jpg")
                  file.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/convert-kelong-jpg.yml

      - name: Commit converted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert Kelong images from WebP to JPG"
          git push
