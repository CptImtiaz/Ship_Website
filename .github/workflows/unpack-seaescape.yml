name: Unpack SeaEscape project

on:
  push:
    paths:
      - '.upload_chunks/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and unpack archive
        shell: bash
        run: |
          test -f .upload_chunks/part06.txt || exit 0
          cat .upload_chunks/part*.txt > /tmp/seaescape.b64
          base64 -d /tmp/seaescape.b64 > /tmp/seaescape.zip
          rm -rf /tmp/unpack
          mkdir -p /tmp/unpack
          unzip -q /tmp/seaescape.zip -d /tmp/unpack
          cp -a /tmp/unpack/seaescape-boat-booking-website/. .
          rm -rf .upload_chunks
          rm -f .github/workflows/unpack-seaescape.yml

      - name: Commit extracted project
        shell: bash
        run: |
          if [ -d .upload_chunks ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace repository with complete SeaEscape project"
          git push
